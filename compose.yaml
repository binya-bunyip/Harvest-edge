services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: harvest_edge
      POSTGRES_USER: harvest_edge
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvest_edge -d harvest_edge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: